---
layout: default
---

<article class="tile">
  <header>
    <h1 class="post-title">{{ page.title }}</h1>
    <time class="post-date" datetime="{{ page.date | date: '%Y-%m-%d' }}">
      {{ page.date | date: '%Y-%m-%d' }}
    </time>
  </header>
  <section class="post-content">{{ content }}</section>
</article>
